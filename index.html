<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>nodes</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0d; }
  canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block;
    touch-action: none;
  }
  :root {
    --motion-fast: 160ms;
    --motion-base: 240ms;
    --motion-slow: 360ms;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  #hero {
    position: fixed; top: 28px; left: 0; right: 0;
    text-align: center; pointer-events: none; z-index: 10;
  }
  #hero .count {
    font: 48px/1 'Georgia', 'Times New Roman', serif;
    color: #ffffff; letter-spacing: -1px;
  }
  #hero .label {
    font: 11px/1 system-ui, sans-serif;
    color: rgba(255,255,255,0.35);
    letter-spacing: 3px; text-transform: uppercase;
    margin-top: 6px;
  }
  #stamp {
    position: fixed; bottom: 20px; left: 16px;
    font: 10px/1.4 system-ui, sans-serif;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.5px; pointer-events: none; z-index: 10;
  }
  #legend {
    position: fixed; bottom: 44px; left: 0; right: 0;
    text-align: center; pointer-events: none; z-index: 10;
    font: 10px/1 system-ui, sans-serif;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
  }
  #desc {
    position: fixed; bottom: 68px; left: 0; right: 0;
    text-align: center; pointer-events: none; z-index: 10;
    font: 11px/1 system-ui, sans-serif;
    color: rgba(255,255,255,0.25);
  }
  #hint {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font: 13px/1.4 system-ui, sans-serif;
    color: rgba(255,255,255,0.5);
    pointer-events: none; z-index: 10;
    transition: opacity var(--motion-slow) var(--ease-out-expo);
  }
  #hint.hidden { opacity: 0; }
  #panel {
    position: fixed; z-index: 20;
    background: #1a1a1a;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 12px 14px;
    min-width: 200px; max-width: 260px;
    opacity: 0; pointer-events: none;
    transition: opacity var(--motion-base) var(--ease-out-expo);
  }
  #panel.visible { opacity: 1; pointer-events: auto; }
  #panel.fade-out { opacity: 0; }
  #panel .row { display: flex; align-items: center; gap: 10px; }
  #panel img {
    width: 32px; height: 32px; border-radius: 4px;
    object-fit: cover; flex-shrink: 0;
  }
  #panel .name {
    font: bold 14px/1.2 system-ui, sans-serif;
    color: rgba(255,255,255,0.85);
  }
  #panel .detail {
    font: 11px/1.5 system-ui, sans-serif;
    color: rgba(255,255,255,0.45);
    margin-top: 8px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hero"><div class="count" id="heroCount">0</div><div class="label">people</div></div>
<div id="stamp">RandomUser API · 0 profiles · …</div>
<div id="legend">○ male &nbsp;·&nbsp; □ female</div>
<div id="desc">A spring-mass network of random people. Tap a node for details.</div>
<div id="hint">Tap a node to learn about them</div>
<div id="panel">
  <div class="row">
    <img id="panelImg" src="" alt="">
    <div class="name" id="panelName"></div>
  </div>
  <div class="detail" id="panelDetail"></div>
</div>

<script>
const C = {
  palette: {
    bg: '#0d0d0d',
    layer: '#1a1a1a',
    accent1: '#e0e0e0',
    accent2: '#9e9e9e',
    accent3: '#ffffff',
    glow: 'rgba(255,255,255,0.08)',
    text: 'rgba(255,255,255,0.6)',
  },
  strokeWeightScale: { hair: 0.5, fine: 1, medium: 2, heavy: 4 },
  alphaHierarchy: { bg: 0.08, field: 0.25, active: 0.7, label: 0.45 },
  nodeRadius: { min: 6, max: 24 },
  ageRange: { min: 18, max: 70 },
  springRestLength: 120,
  springK: 0.008,
  damping: 0.85,
  repulsion: 500,
  connectRadius: 200,
  velocityCap: 5,
  dt: 0.05,
  warmupIterations: 40,
  clusterSpread: 90,
  clusterVariance: 28,
  glowBlur: 16,
  flashDuration: 100,
  idleTimeout: 3000,
  hintDuration: 3000,
  longPressMs: 1000,
  fetchCount: 10,
  refreshCount: 5,
  apiUrl: 'https://randomuser.me/api/?results=10',
};

const PALETTE = C.palette;

const FALLBACK = [
  { name: { first: 'Elena', last: 'Vasquez' }, dob: { age: 34 }, location: { country: 'Spain' }, gender: 'female', email: 'elena.vasquez@example.com', picture: { thumbnail: '' } },
  { name: { first: 'James', last: 'Whitfield' }, dob: { age: 52 }, location: { country: 'United Kingdom' }, gender: 'male', email: 'j.whitfield@example.com', picture: { thumbnail: '' } },
  { name: { first: 'Yuki', last: 'Tanaka' }, dob: { age: 27 }, location: { country: 'Japan' }, gender: 'female', email: 'y.tanaka@example.com', picture: { thumbnail: '' } },
  { name: { first: 'Marcus', last: 'Okonkwo' }, dob: { age: 41 }, location: { country: 'Nigeria' }, gender: 'male', email: 'm.okonkwo@example.com', picture: { thumbnail: '' } },
  { name: { first: 'Sofia', last: 'Andersson' }, dob: { age: 63 }, location: { country: 'Sweden' }, gender: 'female', email: 's.andersson@example.com', picture: { thumbnail: '' } },
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;
let nodes = [];
let springs = [];
let dataSource = '…';
let lastActivity = 0;
let panelVisible = false;
let idleTimer = null;
let flashNode = null;
let flashStart = 0;
let tapping = false;
let longPressTimer = null;
let longPressTriggered = false;
let pressX = 0, pressY = 0;
let pulsePhase = 0;
let countryCenters = {};
let hintShown = false;

function ageToRadius(age) {
  const t = Math.max(0, Math.min(1, (age - C.ageRange.min) / (C.ageRange.max - C.ageRange.min)));
  return C.nodeRadius.min + t * (C.nodeRadius.max - C.nodeRadius.min);
}

function invertScale(pixel, minPx, maxPx, minVal, maxVal) {
  const t = (pixel - minPx) / (maxPx - minPx);
  return minVal + t * (maxVal - minVal);
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function initPositions(users) {
  const countries = [...new Set(users.map(u => u.location.country))];
  const cx = W * 0.5, cy = H * 0.5;
  const ringR = Math.min(W, H) * 0.28;
  countryCenters = {};

  countries.forEach((country, i) => {
    const angle = (i / countries.length) * Math.PI * 2 - Math.PI / 2;
    const jitter = (hashStr(country) % 100) / 100 * C.clusterVariance;
    countryCenters[country] = {
      x: cx + Math.cos(angle) * (ringR + jitter),
      y: cy + Math.sin(angle) * (ringR + jitter * 0.7),
    };
  });

  return users.map((user, idx) => {
    const cc = countryCenters[user.location.country];
    const seed = hashStr(user.email || user.name.first + idx);
    const ox = ((seed % 200) - 100) / 100 * C.clusterSpread;
    const oy = (((seed >> 8) % 200) - 100) / 100 * C.clusterSpread;
    const r = ageToRadius(user.dob.age);
    return {
      user,
      x: cc.x + ox,
      y: cc.y + oy,
      vx: 0, vy: 0,
      radius: r,
      id: idx,
    };
  });
}

function buildSprings(nds) {
  const links = [];
  for (let i = 0; i < nds.length; i++) {
    for (let j = i + 1; j < nds.length; j++) {
      const dx = nds[i].x - nds[j].x;
      const dy = nds[i].y - nds[j].y;
      const dist = Math.hypot(dx, dy);
      if (dist < C.connectRadius) links.push({ a: i, b: j, rest: C.springRestLength });
    }
  }
  return links;
}

function physicsStep() {
  const n = nodes.length;
  const fx = new Float64Array(n);
  const fy = new Float64Array(n);

  for (const s of springs) {
    const a = nodes[s.a], b = nodes[s.b];
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.max(Math.hypot(dx, dy), 0.001);
    const force = C.springK * (dist - s.rest);
    const nx = dx / dist, ny = dy / dist;
    fx[s.a] += force * nx;
    fy[s.a] += force * ny;
    fx[s.b] -= force * nx;
    fy[s.b] -= force * ny;
  }

  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = nodes[j].x - nodes[i].x;
      const dy = nodes[j].y - nodes[i].y;
      const distSq = Math.max(dx * dx + dy * dy, 100);
      const force = C.repulsion / distSq;
      const dist = Math.sqrt(distSq);
      const nx = dx / dist, ny = dy / dist;
      fx[i] -= force * nx;
      fy[i] -= force * ny;
      fx[j] += force * nx;
      fy[j] += force * ny;
    }
    fx[i] += (W * 0.5 - nodes[i].x) * 0.0003;
    fy[i] += (H * 0.5 - nodes[i].y) * 0.0003;
  }

  for (let i = 0; i < n; i++) {
    nodes[i].vx = (nodes[i].vx + fx[i] * C.dt) * C.damping;
    nodes[i].vy = (nodes[i].vy + fy[i] * C.dt) * C.damping;
    const spd = Math.hypot(nodes[i].vx, nodes[i].vy);
    if (spd > C.velocityCap) {
      nodes[i].vx = (nodes[i].vx / spd) * C.velocityCap;
      nodes[i].vy = (nodes[i].vy / spd) * C.velocityCap;
    }
    nodes[i].x += nodes[i].vx;
    nodes[i].y += nodes[i].vy;
    const pad = 40;
    nodes[i].x = Math.max(pad, Math.min(W - pad, nodes[i].x));
    nodes[i].y = Math.max(pad + 60, Math.min(H - pad - 90, nodes[i].y));
  }
}

function warmup() {
  for (let i = 0; i < C.warmupIterations; i++) physicsStep();
}

function drawNode(n, isFlash) {
  const { user, x, y, radius } = n;
  const isMale = user.gender === 'male';
  const pulse = 0.5 + 0.5 * Math.sin(pulsePhase + n.id * 1.3);
  const glowAlpha = C.alphaHierarchy.field * (0.6 + 0.4 * pulse);

  ctx.save();
  ctx.shadowColor = PALETTE.glow;
  ctx.shadowBlur = C.glowBlur * (0.5 + 0.5 * pulse);
  ctx.strokeStyle = `rgba(255,255,255,${glowAlpha})`;
  ctx.lineWidth = C.strokeWeightScale.fine;
  ctx.fillStyle = isFlash ? PALETTE.accent3 : PALETTE.layer;

  if (isMale) {
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else {
    const s = radius * 1.6;
    ctx.beginPath();
    ctx.rect(x - s / 2, y - s / 2, s, s);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();

  ctx.font = `${10 + (radius > 14 ? 1 : 0)}px system-ui, sans-serif`;
  ctx.fillStyle = `rgba(255,255,255,${C.alphaHierarchy.label})`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(`${user.name.first} ${user.dob.age}`, x, y + radius + 4);
}

function draw() {
  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = `rgba(30,30,30,${C.alphaHierarchy.active})`;
  ctx.lineWidth = C.strokeWeightScale.fine;
  for (const s of springs) {
    const a = nodes[s.a], b = nodes[s.b];
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  ctx.strokeStyle = `rgba(158,158,158,${C.alphaHierarchy.field})`;
  ctx.lineWidth = C.strokeWeightScale.hair;
  for (const s of springs) {
    const a = nodes[s.a], b = nodes[s.b];
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  for (const country of Object.keys(countryCenters)) {
    const members = nodes.filter(n => n.user.location.country === country);
    if (!members.length) continue;
    let sx = 0, sy = 0;
    for (const m of members) { sx += m.x; sy += m.y; }
    const cx = sx / members.length, cy = sy / members.length;
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillStyle = `rgba(158,158,158,${C.alphaHierarchy.bg + 0.05})`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(country, cx, cy - 22);
  }

  const now = performance.now();
  const flashActive = flashNode && (now - flashStart) < C.flashDuration;

  for (const n of nodes) {
    const isFlash = flashActive && n === flashNode;
    drawNode(n, isFlash);
  }
}

function updateStamp() {
  document.getElementById('stamp').textContent =
    `RandomUser API · ${nodes.length} profiles · ${dataSource}`;
  document.getElementById('heroCount').textContent = nodes.length;
}

function hitTest(mx, my) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const isMale = n.user.gender === 'male';
    const hitR = isMale ? n.radius + 6 : n.radius * 0.8 + 6;
    if (Math.hypot(mx - n.x, my - n.y) < hitR) return n;
  }
  return null;
}

function showPanel(node, sx, sy) {
  const panel = document.getElementById('panel');
  const u = node.user;
  document.getElementById('panelImg').src = u.picture.thumbnail || '';
  document.getElementById('panelName').textContent = `${u.name.first} ${u.name.last}`;
  document.getElementById('panelDetail').innerHTML =
    `${u.dob.age} years · ${u.location.country}<br>${u.email}<br>${u.gender}`;

  const pw = 220, ph = 110;
  let px = sx + 16, py = sy - ph / 2;
  if (px + pw > W - 12) px = sx - pw - 16;
  if (py < 80) py = 80;
  if (py + ph > H - 100) py = H - ph - 100;
  panel.style.left = px + 'px';
  panel.style.top = py + 'px';
  panel.classList.remove('fade-out');
  panel.classList.add('visible');
  panelVisible = true;
  resetIdleTimer();
}

function hidePanel() {
  const panel = document.getElementById('panel');
  panel.classList.add('fade-out');
  panel.classList.remove('visible');
  panelVisible = false;
}

function resetIdleTimer() {
  lastActivity = performance.now();
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (panelVisible) hidePanel();
  }, C.idleTimeout);
}

function onTap(mx, my) {
  const node = hitTest(mx, my);
  if (!node) {
    if (panelVisible) hidePanel();
    return;
  }
  flashNode = node;
  flashStart = performance.now();
  showPanel(node, mx, my);
  resetIdleTimer();
}

function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

async function loadUsers(count) {
  let users;
  try {
    const res = await fetch(count === C.fetchCount ? C.apiUrl : `https://randomuser.me/api/?results=${count}`);
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    users = data.results;
    dataSource = 'live';
  } catch {
    users = FALLBACK.slice(0, Math.max(5, count));
    dataSource = 'fallback';
  }
  resize();
  nodes = initPositions(users);
  springs = buildSprings(nodes);
  warmup();
  if (panelVisible) hidePanel();
  updateStamp();
}

canvas.addEventListener('touchstart', (e) => {
  tapping = true;
  longPressTriggered = false;
  const p = getPointerPos(e);
  pressX = p.x; pressY = p.y;
  longPressTimer = setTimeout(async () => {
    longPressTriggered = true;
    await loadUsers(C.refreshCount);
  }, C.longPressMs);
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  const p = getPointerPos(e);
  if (Math.hypot(p.x - pressX, p.y - pressY) > 12 && longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (!longPressTriggered) {
    const p = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    onTap(p.clientX - rect.left, p.clientY - rect.top);
  }
  setTimeout(() => { tapping = false; }, 300);
});

canvas.addEventListener('mousedown', (e) => {
  if (tapping) return;
  longPressTriggered = false;
  const p = getPointerPos(e);
  pressX = p.x; pressY = p.y;
  longPressTimer = setTimeout(async () => {
    longPressTriggered = true;
    await loadUsers(C.refreshCount);
  }, C.longPressMs);
});

canvas.addEventListener('mousemove', (e) => {
  if (!longPressTimer) return;
  const p = getPointerPos(e);
  if (Math.hypot(p.x - pressX, p.y - pressY) > 12) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (tapping) return;
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (!longPressTriggered) onTap(pressX, pressY);
});

function loop() {
  pulsePhase += 0.04;
  physicsStep();
  draw();
  requestAnimationFrame(loop);
}

async function init() {
  resize();
  window.addEventListener('resize', () => {
    resize();
    if (nodes.length) {
      nodes = initPositions(nodes.map(n => n.user));
      springs = buildSprings(nodes);
      warmup();
    }
  });

  if (!localStorage.getItem('nodes_visited')) {
    localStorage.setItem('nodes_visited', '1');
    setTimeout(() => document.getElementById('hint').classList.add('hidden'), C.hintDuration);
  } else {
    document.getElementById('hint').classList.add('hidden');
  }

  await loadUsers(C.fetchCount);
  loop();
}

init();
</script>
</body>
</html>
